<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedula Setup</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../frontend/css/main.css">
  <script src="../frontend/scripts/theme.js"></script>
</head>

<body>

  <!-- Mini Navbar matching landing page style -->
  <header class="auth-header">
    <a class="auth-brand" href="../index.html" aria-label="Schedula home">
      <img src="../assets/logo.png" alt="Logo" class="auth-logo">
      <span class="auth-brand-text">Schedula</span>
    </a>
    <nav class="auth-nav">
      <button class="theme-toggle auth-theme-btn" aria-label="Toggle theme"></button>
    </nav>
  </header>

  <div class="page-shell">
    <div class="login-card">
      <div class="card-content">
        <h1>Complete Your Setup</h1>
        <p class="subtitle">Select your program, year level, and semester</p>

        <div class="form-group">
          <label class="field">
            <span>Full Name</span>
            <input type="text" placeholder="Full Name" aria-label="Full name" id="name-input">
          </label>

          <label class="field">
            <span>Program</span>
            <select id="program-select" aria-label="Select program">
              <option value="">-- Select a program --</option>
            </select>
          </label>

          <label class="field">
            <span>Year Level</span>
            <select id="year-select" aria-label="Select year level" disabled>
              <option value="">-- Select year level --</option>
            </select>
          </label>

          <label class="field">
            <span>Semester</span>
            <select id="semester-select" aria-label="Select semester" disabled>
              <option value="">-- Select semester --</option>
            </select>
          </label>
        </div>
        <div class="separator"></div>
        <button class="button primary setup-btn">Continue</button>
      </div>
    </div>
  </div>

  <script src="../frontend/scripts/utils.js"></script>
  <script src="../frontend/scripts/popup.js"></script>
  <script src="../frontend/scripts/footer.js"></script>
  <script src="../frontend/scripts/setup.js"></script>
</body>

</html>
