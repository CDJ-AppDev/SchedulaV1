<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../frontend/css/main.css">
  <script src="../frontend/scripts/theme.js"></script>
</head>

<body>
  <!-- Mini Navbar matching landing page style -->
  <header class="auth-header">
    <a class="auth-brand" href="../index.html" aria-label="Schedula home">
      <img src="../assets/logo.png" alt="Logo" class="auth-logo">
      <span class="auth-brand-text">Schedula</span>
    </a>
    <nav class="auth-nav">
      <button class="theme-toggle auth-theme-btn" aria-label="Toggle theme"></button>
      <button class="auth-back-btn" aria-label="Back to login" onclick="window.location.href='./login.html'">← Back to
        Login</button>
    </nav>
  </header>

  <div class="page-shell">
    <div class="login-card">
      <button class="close-btn" aria-label="Close form" onclick="window.location.href='./login.html'">×</button>
      <div class="card-content">
        <h1 id="forgot-title">Forgot Password</h1>
        <p class="subtitle" id="forgot-subtitle">Enter your email address to request a secure password reset PIN</p>

        <!-- Message Banner -->
        <div id="message-banner"
          style="display: none; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; font-weight: 500; text-align: center; border: 1px solid transparent;">
        </div>

        <!-- State 1: Request PIN -->
        <div id="request-pin-section">
          <div class="form-group">
            <label class="field">
              <span>Email Address</span>
              <input type="email" id="reset-email" placeholder="email@example.com" aria-label="Email address">
            </label>
          </div>
          <div class="separator"></div>
          <button type="button" class="button primary forgot-btn" id="forgot-submit-btn">Send Reset PIN</span></button>
        </div>

        <!-- State 2: Enter PIN and Reset Password (initially hidden) -->
        <div id="reset-password-section" style="display: none;">
          <div class="form-group">
            <label class="field">
              <span>6-Digit Verification PIN</span>
              <input type="text" id="reset-pin" placeholder="000000" maxlength="6" aria-label="Verification PIN"
                style="letter-spacing: 6px; text-align: center; font-size: 20px; font-weight: bold; font-family: monospace;">
            </label>
          </div>
          <div class="form-group" style="margin-top: 15px;">
            <label class="field">
              <span>New Password</span>
              <input type="password" id="new-password" placeholder="New Password" aria-label="New password">
            </label>
          </div>
          <div class="form-group" style="margin-top: 15px;">
            <label class="field">
              <span>Confirm Password</span>
              <input type="password" id="confirm-password" placeholder="Confirm Password" aria-label="Confirm password">
            </label>
          </div>
          <div class="separator"></div>
          <button type="button" class="button primary forgot-btn" id="reset-submit-btn">Reset Password</button>
        </div>

        <div class="separator"></div>

        <div class="footer-links">
          <p><button class="link-button accent" id="login-link" onclick="window.location.href='./login.html'">Back to
              Login</button></p>
        </div>
      </div>
    </div>
  </div>

  <script src="../frontend/scripts/utils.js"></script>
  <script src="../frontend/scripts/popup.js"></script>
  <script src="../frontend/scripts/footer.js"></script>
  <script src="../frontend/scripts/auth.js" defer></script>
</body>

</html>
