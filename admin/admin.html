<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Schedula Admin</title><link rel="icon" type="image/png" href="../favicon.png"><link rel="stylesheet" href="../frontend/css/main.css"><link rel="stylesheet" href="../frontend/css/admin.css"><script src="../frontend/scripts/theme.js"></script></head>
<body>
<header class="app-header"><div class="app-brand"><img src="../assets/logo.png" alt="Schedula" class="brand-icon"><div class="brand-text"><span>Schedula</span></div></div><nav class="app-nav"><button class="nav-button" onclick="window.location.href='../pages/home.html'"><img src="../assets/home.png" alt="Home" class="nav-icon"> Home</button><button class="nav-button" onclick="window.location.href='../pages/builder.html'"><img src="../assets/builder.png" alt="Builder" class="nav-icon"> Builder</button><button class="nav-button" onclick="window.location.href='../pages/plotter.html'"><img src="../assets/plotter.png" alt="Plotter" class="nav-icon"> Plotter</button></nav><div class="header-profile"><img src="../assets/profile.png" alt="Profile" class="header-profile-img"><span class="header-username" id="header-username-display">Admin</span></div><div class="header-controls"><button class="header-icon-btn theme-toggle" aria-label="Toggle theme"></button><button class="header-icon-btn close-btn" onclick="handleLogout('../index.html')"><img src="../assets/logout.png" alt="Log out" class="header-icon-img"></button></div></header>
<main class="page-content"><div class="page-title"><div class="page-title-header"><img src="../assets/admin.png" alt="Admin" class="page-title-icon"><h1>Admin dashboard</h1></div><p>Manage users and schedules.</p></div><section class="page-panel"><div class="admin-tabs"><button class="admin-tab active" data-tab="users">Users</button><button class="admin-tab" data-tab="schedules">Schedules</button></div><div id="users-tab" class="admin-content active"><div class="tab-header"><h3>Users</h3><button id="create-user-btn" class="btn-primary">Create user</button></div><div class="table-container"><table class="admin-table"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Created</th><th>Actions</th></tr></thead><tbody id="users-tbody"></tbody></table></div></div><div id="schedules-tab" class="admin-content"><div class="tab-header"><h3>Schedules</h3></div><div class="table-container"><table class="admin-table"><thead><tr><th>ID</th><th>Owner</th><th>Title</th><th>Events</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="schedules-tbody"></tbody></table></div></div></section></main>
<div id="admin-modal" class="modal"><div class="modal-content"><button id="close-modal" class="modal-close" type="button">&times;</button><h3>Create user</h3><form id="user-form"><label class="field"><span>Email</span><input id="user-email" type="email" required></label><label class="field"><span>Password</span><input id="user-password" type="password" required></label><label class="field"><span>Display name</span><input id="user-name" type="text"></label><label class="field"><span>Role</span><select id="user-role"><option value="user">User</option><option value="admin">Admin</option></select></label><button class="btn-primary" type="submit">Create user</button></form></div></div>
<script src="../frontend/scripts/utils.js"></script><script src="../frontend/scripts/auth.js"></script><script src="../frontend/scripts/popup.js"></script><script src="admin.js"></script>
</body></html>
